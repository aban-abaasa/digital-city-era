server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /runtime-config.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # Vercel analytics scripts only exist on the cloud site. Without this the SPA fallback below answers
  # with index.html (HTML), which the browser then fails to parse as a script ("Unexpected token '<'").
  location /_vercel/ {
    return 404;
  }

  location /local-auth/ {
    # Look the service up again through Docker's DNS instead of once at start-up, so recreating the
    # sync-agent container (an update, a restart) does not leave this proxy pointing at its old address.
    resolver 127.0.0.11 valid=10s;
    set $local_auth_upstream http://business-local-sync-agent:3010;
    rewrite ^/local-auth/(.*)$ /$1 break;
    proxy_pass $local_auth_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
